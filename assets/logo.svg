    <polygon points="179,368 179,260 166,260 192,224 218,260 205,260 205,368" fill="#06b6d4" stroke="black" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="192,211 316,211 316,198 352,224 316,250 316,237 192,237" fill="#3b82f6" stroke="black" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="339,224 339,268 326,268 352,304 378,268 365,268 365,224" fill="#8b5cf6" stroke="black" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="352,291 292,291 292,278 256,304 292,330 292,317 352,317" fill="#ec4899" stroke="black" stroke-width="2" stroke-linejoin="round"/>
  </g>

