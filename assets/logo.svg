<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OpenFibrilFold">
  <title>OpenFibrilFold</title>
  <desc>Three stacked rainbow Greek-key meanders, each successively rotated counter-clockwise around the inner endpoint of the meander (where the pink arrow lands), evoking the helical twist between layers of an amyloid fibril cross-section. Each arrow is a single combined shaft+head polygon with a thin black border on its perimeter (no internal seam at the rectangle/triangle join). Back layers fade to 0.5 and 0.7 alpha.</desc>

